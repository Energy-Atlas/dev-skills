# Builds the site with `mkdocs build --strict` on pushes to feature/mkdocs-site and main, on pull requests, and on manual
# runs, and deploys to GitHub Pages (Settings -> Pages -> Source: GitHub Actions) only from main. The github-pages
# environment also allows deployments from main alone, so no other branch can deploy even if this file changes. Changes
# reach main only by a merge the owner has approved. Never use `mkdocs gh-deploy`: the site is built here, not committed.
name: Pages
on:
  push:
    branches: [feature/mkdocs-site, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
