# The dev-skills site: a landing page and one page per skill. Build it with `mkdocs build --strict` and serve it with
# `mkdocs serve`, both from the repository root (requirements-docs.txt). Its styling follows design/ui-design-spec.md,
# whose section 0 wins. Each skill page includes its skills/<name>/SKILL.md at build time (pymdownx.snippets below).
# .github/workflows/pages.yml deploys it to GitHub Pages from the gh-pages branch only.
site_name: EnergyAtlas dev-skills
site_description: Reusable agent skills for the development work of the EnergyAtlas organisation
site_url: https://energy-atlas.github.io/dev-skills/
repo_url: https://github.com/Energy-Atlas/dev-skills
repo_name: Energy-Atlas/dev-skills
edit_uri: ""

site_dir: site
strict: true

theme:
  name: material
  # overrides/main.html preloads the main fonts, so a full page load draws its first frame with them.
  custom_dir: overrides
  language: en
  # No font host: docs/assets/stylesheets/fonts.css serves the fonts from the site (design/ui-design-spec.md, 0.4).
  font: false
  features:
    # Instant navigation swaps only the page content, so the header, sidebars, and fonts persist between pages.
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/fonts.css
  - assets/stylesheets/energyatlas.css

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  # Skill pages include skills/<name>/SKILL.md from the repository root; a missing file fails the build.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Every broken link, missing nav target, and unlisted page is a warning, so `--strict` fails on it.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

# One page per skill, in the order of the landing page's grid (design/ui-design-spec.md, 0.14).
nav:
  - Home: index.md
  - Skills:
      - wiki-ui-alignment: skills/wiki-ui-alignment.md
      - technical-pptx-design: skills/technical-pptx-design.md
